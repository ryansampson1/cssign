<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Post &amp; Panel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800;900&family=Overpass+Mono:wght@400;600&display=swap">
<style>
/* Layout: highway-green sign rail on the left, work surface on the right; rail becomes a top strip on phones. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --sunk:#E8ECE8; --ink:#14201A; --muted:#56665D; --line:#D7DED8;
  --rail:#0B4A35; --rail-ink:#EAF4EE; --rail-dim:#A9C8B8; --rail-hi:#13664A;
  --accent:#0B6B4B; --accent-ink:#FFFFFF; --accent-soft:#DDEEE5;
  --good:#1E7B46; --good-soft:#DFF1E5; --warn:#9A6200; --warn-soft:#FBEFD6; --bad:#B3261E; --bad-soft:#F9E1DE; --info:#24527A; --info-soft:#E0EBF5;
  --f-display:"Overpass","Arial Narrow",Arial,sans-serif; --f-body:"Overpass",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"Overpass Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151E1A; --sunk:#1B2621; --ink:#E5ECE8; --muted:#94A69C; --line:#2A3832;
  --rail:#082A1F; --rail-ink:#E3F1E9; --rail-dim:#86A898; --rail-hi:#11402F;
  --accent:#3DB487; --accent-ink:#06140E; --accent-soft:#17352A;
  --good:#5BCB8A; --good-soft:#163323; --warn:#E4AE4C; --warn-soft:#3A2C10; --bad:#F2807A; --bad-soft:#3E1B19; --info:#8BB8E0; --info-soft:#172A3B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151E1A; --sunk:#1B2621; --ink:#E5ECE8; --muted:#94A69C; --line:#2A3832;
  --rail:#082A1F; --rail-ink:#E3F1E9; --rail-dim:#86A898; --rail-hi:#11402F;
  --accent:#3DB487; --accent-ink:#06140E; --accent-soft:#17352A;
  --good:#5BCB8A; --good-soft:#163323; --warn:#E4AE4C; --warn-soft:#3A2C10; --bad:#F2807A; --bad-soft:#3E1B19; --info:#8BB8E0; --info-soft:#172A3B; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rail)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:2px solid var(--rail-ink);border-radius:8px}
.brand b{font-family:var(--f-display);font-weight:900;font-size:19px;letter-spacing:.02em;text-transform:uppercase;line-height:1.05}
.brand span{font-size:11px;color:var(--rail-dim);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;color:var(--rail-ink);font-weight:600;font-size:14px}
.nav button:hover{background:var(--rail-hi)}
.nav button[aria-current="page"]{background:var(--rail-ink);color:var(--rail)}
.nav button:focus-visible{outline:2px solid var(--rail-ink);outline-offset:2px}
.nav .ct{font-family:var(--f-mono);font-size:11px;min-width:22px;text-align:center;padding:1px 6px;border-radius:99px;background:var(--rail-hi);color:var(--rail-ink)}
.nav button[aria-current="page"] .ct{background:var(--rail);color:var(--rail-ink)}
.rail .foot{margin-top:auto;font-size:11px;color:var(--rail-dim);display:flex;flex-direction:column;gap:6px}
.rail .foot button{all:unset;cursor:pointer;text-decoration:underline;color:var(--rail-ink)}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top h1{font-family:var(--f-display);font-size:20px;font-weight:800;margin:0;text-wrap:balance}
.viewas{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.viewas label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.staging{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);padding:3px 8px;border-radius:4px}
main{padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;min-width:0}
h2{font-family:var(--f-display);font-size:16px;font-weight:800;margin:0;text-wrap:balance}
h3{font-size:13px;margin:0;font-weight:700}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .s{font-size:12px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--sunk)}
.tbl input{width:88px;text-align:right;padding:5px 7px;border:1px solid var(--line);border-radius:5px;background:var(--bg);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tbl input:focus{outline:2px solid var(--accent);outline-offset:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.field input,.field select,.field textarea,select.inp{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);width:100%;min-width:0}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.lines{width:100%;border-collapse:collapse;font-size:13px}
.lines td{padding:6px 0;border-bottom:1px dashed var(--line)}
.lines td.r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:10px}
.lines tr.tot td{border-bottom:0;border-top:2px solid var(--ink);font-weight:800;font-size:15px;padding-top:9px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:6px;overflow:hidden}
.split div{background:var(--accent-soft);padding:10px;display:flex;flex-direction:column;gap:2px}
.split b{font-family:var(--f-mono);font-size:16px}
.track{display:flex;gap:3px;align-items:stretch;flex-wrap:wrap}
.track span{flex:1 1 60px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:6px 6px 5px;border-top:4px solid var(--line);color:var(--muted)}
.track span.done{border-color:var(--accent);color:var(--ink)}
.track span.now{border-color:var(--warn);color:var(--ink)}
.list{display:flex;flex-direction:column;gap:0}
.item{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item:last-child{border-bottom:0}
.item .grow{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.proof{width:100%;max-width:100%;height:auto;border:1px solid var(--line);border-radius:4px;background:#fff}
.note{font-size:12px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:6px;font-size:13px}
.alert.warn{background:var(--warn-soft);color:var(--ink)} .alert.bad{background:var(--bad-soft)} .alert.info{background:var(--info-soft)}
.bar-row{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:12px}
.bar-row .b{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar-row .b i{display:block;height:100%;background:var(--accent)}
svg .ax{stroke:var(--line)} svg .lbl{fill:var(--muted);font-size:10px;font-family:var(--f-mono)} svg .bar{fill:var(--accent)} svg .bar.cur{fill:var(--warn)} svg .val{fill:var(--ink);font-size:10px;font-family:var(--f-mono)}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:20;display:flex;justify-content:flex-end}
.modal{background:var(--bg);width:min(720px,100%);height:100%;overflow:auto;padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));padding-left:18px;padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));right:max(18px,env(safe-area-inset-right,0px));background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:6px;font-weight:700;z-index:30;max-width:calc(100% - 36px)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
textarea{resize:vertical}
.sop{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.sop:last-child{border-bottom:0}
.sop .n{font-family:var(--f-display);font-weight:900;font-size:22px;color:var(--accent)}
.sop ul{margin:4px 0 0;padding-left:18px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:column;gap:10px;padding-block:12px;padding-right:max(14px,env(safe-area-inset-right,0px))}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav button{white-space:nowrap}
  .rail .foot{display:none}
  .grid2,.grid3,.form{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top{position:static}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.4}}}

/* ---------- PUBLIC WEBSITE ---------- */
:root{--signal:#F2C230;--signal-ink:#17150B}
html{scroll-behavior:auto}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
#site{min-height:100%;background:var(--bg)}
#site section[id]{scroll-margin-top:84px}
.s-wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.s-stagebar{background:var(--warn-soft);color:var(--ink);font-size:12px}
.s-stagebar .s-wrap{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding-block:6px}
.s-stagebar select{padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.s-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--surface);border-bottom:1px solid var(--line)}
.s-head .s-wrap{display:flex;align-items:center;gap:20px;min-height:68px;flex-wrap:wrap;padding-block:8px}
.wordmark{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--ink);text-decoration:none;font-size:17px;line-height:1}
.wordmark .cs{background:#0B4A35;color:#fff;padding:7px 9px 4px;border-radius:5px;font-size:21px;letter-spacing:.02em;box-shadow:inset 0 0 0 2px #0B4A35,inset 0 0 0 4px #fff}
.wordmark small{display:block;font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:700;margin-top:3px}
.wordmark img{height:42px;width:auto}
.s-links{display:flex;gap:22px;margin-left:auto;align-items:center}
.s-links a{color:var(--ink);text-decoration:none;font-weight:700;font-size:14px}
.s-links a:hover{color:var(--accent)}
.s-actions{display:flex;gap:10px;align-items:center}
.linkbtn{all:unset;cursor:pointer;font-weight:700;font-size:14px;color:var(--ink);padding:8px 4px;border-bottom:2px solid transparent}
.linkbtn:hover{border-color:var(--accent)}
.linkbtn:focus-visible,.plate:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.plate{cursor:pointer;background:var(--signal);color:var(--signal-ink);font-family:var(--f-display);font-weight:900;text-transform:uppercase;letter-spacing:.05em;border:0;border-radius:9px;box-shadow:inset 0 0 0 3px var(--signal),inset 0 0 0 5px var(--signal-ink);padding:11px 18px 8px;font-size:14px;line-height:1;display:inline-flex;align-items:center;gap:10px}
.plate:hover{filter:brightness(1.05)}
.plate.xl{font-size:32px;padding:24px 34px 19px;border-radius:14px;box-shadow:inset 0 0 0 4px var(--signal),inset 0 0 0 8px var(--signal-ink),0 14px 30px rgba(0,0,0,.28)}
@media (prefers-reduced-motion:no-preference){.plate.xl{transition:transform .15s ease}.plate.xl:hover{transform:translateY(-2px)}}
.s-hero{background:#0B4A35;color:#EAF4EE}
.s-hero .s-wrap{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);gap:44px;align-items:center;padding-block:56px 60px}
.s-hero .eyebrow{color:#A9C8B8}
.s-hero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,4.6vw,58px);line-height:1.02;letter-spacing:-.01em;margin:10px 0 16px;text-wrap:balance}
.s-hero p.lede{font-size:18px;line-height:1.55;max-width:34em;color:#D3E6DB;margin:0 0 26px}
.s-hero .cta{display:flex;flex-wrap:wrap;gap:16px 22px;align-items:center}
.s-hero .cta .linkbtn{color:#EAF4EE}
.s-hero .cta .linkbtn:hover{border-color:var(--signal)}
.s-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin:34px 0 0;padding-top:20px;border-top:1px solid #2E6B54}
.s-facts div{display:flex;flex-direction:column;gap:2px}
.s-facts b{font-family:var(--f-display);font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;color:#fff}
.s-facts span{font-size:12px;color:#A9C8B8}
.scene{display:block;width:100%;max-width:100%;height:auto;border-radius:10px}
.s-hero figure{margin:0;box-shadow:0 20px 50px rgba(0,0,0,.35);border-radius:10px}
.s-trust{background:var(--surface);border-bottom:1px solid var(--line)}
.s-trust .s-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:14px 34px;padding-block:24px}
.s-trust .eyebrow{flex:0 0 auto;max-width:15em}
.s-clients{display:flex;flex-wrap:wrap;gap:12px 34px;align-items:center;flex:1 1 400px}
.s-clients span{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:.02em;color:var(--muted);white-space:nowrap}
.s-clients img{height:34px;width:auto;filter:grayscale(1);opacity:.8}
.s-sec{padding-block:68px}
.s-sec.alt{background:var(--surface);border-block:1px solid var(--line)}
.s-sec h2.s-h{font-family:var(--f-display);font-weight:900;font-size:clamp(26px,3.2vw,38px);line-height:1.08;margin:6px 0 10px;text-wrap:balance}
.s-sec p.s-sub{font-size:16px;color:var(--muted);max-width:42em;margin:0 0 30px;line-height:1.55}
.s-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.s-svc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:10px}
.s-sec.alt .s-svc{background:var(--bg)}
.s-svc svg{width:40px;height:40px;color:var(--accent)}
.s-svc h3{font-family:var(--f-display);font-size:19px;font-weight:800;margin:0}
.s-svc p{margin:0;color:var(--muted);line-height:1.5}
.s-svc .from{margin-top:auto;font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--accent);padding-top:6px}
.s-band{margin-top:22px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--accent-soft);border-radius:10px;padding:20px 24px}
.s-band b{font-family:var(--f-display);font-size:18px;font-weight:900}
.s-steps{padding:0;margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;counter-reset:st}
.s-steps li{list-style:none;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--accent);padding-top:14px}
.s-steps li::before{counter-increment:st;content:counter(st);font-family:var(--f-display);font-weight:900;font-size:34px;color:var(--accent);line-height:1}
.s-steps h3{font-size:17px;font-family:var(--f-display);font-weight:800;margin:0}
.s-steps p{margin:0;color:var(--muted);line-height:1.5}
.s-steps ol{padding:0;margin:0}
.s-work{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.s-work figure{margin:0;display:flex;flex-direction:column;gap:8px}
.s-work img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:10px;max-width:100%}
.s-work figcaption{font-size:13px;color:var(--muted)}

const addBusinessDays = (d,n) => { let x=new Date(d); let k=0; while(k<n){ x=addDays(x,1); if(x.getDay()!==0 && x.getDay()!==6) k++; } return x; };

const COLS = ['accounts','orders','invoices','fieldSigns','inventory','log','settings','history'];
const Store = {
  d:{}, fb:null, ready:false,
  async init(){
    if (CONFIG.backend==='firebase' && CONFIG.firebase) return this.initFirebase();
    let saved=null; try { saved = JSON.parse(localStorage.getItem(LSKEY)); } catch(e) {}
    this.d = saved && saved.d ? saved.d : seed();
    this.ready = true; this.save();
  },
  all(c){ return this.d[c] || []; },
  get(c,id){ return this.all(c).find(x=>x.id===id); },
  put(c,doc){
    const a = this.d[c] || (this.d[c]=[]);
    const i = a.findIndex(x=>x.id===doc.id); if (i>=0) a[i]=doc; else a.push(doc);
    if (this.fb) this.fb.collection(c).doc(doc.id).set(JSON.parse(JSON.stringify(doc)));
    else this.save();
    return doc;
  },
  save(){ try { localStorage.setItem(LSKEY, JSON.stringify({d:this.d})); } catch(e) {} },
  reset(){ if (this.fb) { toast('Reset is disabled on the live database'); return; } this.d = seed(); this.save(); },
  async initFirebase(){
    const v='10.12.2', base=`https://www.gstatic.com/firebasejs/${v}/`;
    for (const f of ['firebase-app-compat.js','firebase-auth-compat.js','firebase-firestore-compat.js','firebase-storage-compat.js'])
      await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=base+f; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
    firebase.initializeApp(CONFIG.firebase);
    this.fb = firebase.firestore(); this.storage = firebase.storage();
    $('#stagingPill').textContent = 'Staging · admin login';
    $('#modeNote').textContent = 'Connected to Firebase';
    return new Promise(resolve => {
      firebase.auth().onAuthStateChanged(user => {
        if (!user) { renderLogin(); return; }
        let pending = COLS.length;
        COLS.forEach(c => this.fb.collection(c).onSnapshot(snap => {
          this.d[c] = snap.docs.map(d=>d.data());
          if (pending>0 && --pending===0) { this.ready=true; resolve(); }
          if (this.ready) render();
        }, err => { $('#main').innerHTML = `<div class="alert bad">Database access denied for ${esc(user.email)}. Ask the owner to grant your account a role. (${esc(err.message)})</div>`; }));
      });
    });
  },
};

    await ref.put(file); return { name:file.name, url: await ref.getDownloadURL() };
  }
  return { name:file.name, url:URL.createObjectURL(file), demo:true };
}

function nextId(prefix){

/* ============================================================
   PRICING ENGINE
   ============================================================ */
const PB = () => Store.get('settings','pricebook') || DEFAULT_PB;
const prod = id => PB().products.find(p=>p.id===id);
const loaded = direct => direct*(1+PB().labor.overheadPct);
const priceFrom = (direct, cat) => roundUp(loaded(direct)/(1-PB().margins[cat]), PB().labor.roundTo);

function panelCost(p, w, h){
  const pb=PB(), m=pb.materials, L=pb.labor; const area = w*h;
  let mat = 0;
  if (p.substrate) mat += (p.custom ? area/32*(1+L.wastePct) : p.sheets) * m[p.substrate].cost;
  if (p.print==='mounted') mat += area*p.sides*(m.printVinyl.cost+m.laminate.cost+m.ink.cost);
  if (p.print==='direct')  mat += area*p.sides*m.ink.cost;
  (p.extras||[]).forEach(e => mat += (e.perSF ? area : (e.qty||1)) * m[e.mat].cost);
  const min = p.laborMin + (p.laborPerSF||0)*area;
  const labor = min/60*L.rate;
  return { mat, min, labor, direct: mat+labor, area };
}
function panelPrice(p, w, h){
  const c = panelCost(p, w, h);
  let price = priceFrom(c.direct, p.cat);
  if (p.min) price = Math.max(price, p.min);
  return { ...c, price, margin: 1 - loaded(c.direct)/price };
}
function postPkg(id){
  const pb=PB(), m=pb.materials, k=pb.posts.find(x=>x.id===id);
  const r = pb.labor.postReusePct||0;
  const perPost = (1-r)*m.post4x4.cost + m.postPaint.cost;                 // new posts bought only for the share not covered by returns
  const mat = k.posts*perPost + m.hardware.cost;
  const labor = (k.laborMin + k.posts*r*(pb.labor.repaintMin||0))/60*pb.labor.rate; const direct = mat+labor; const price = priceFrom(direct,'posts');
  return { ...k, mat, labor, direct, price, margin: 1-loaded(direct)/price };
}
function autoPkg(area){ return area<=12 ? 'PK34' : area<=16 ? 'PK44' : area<=24 ? 'PK46' : 'PK48'; }
function zoneFor(miles){ return PB().zones.find(z=>miles<=z.maxMi) || null; }
function tripCost(z, onsiteMin){
  const L=PB().labor, m=PB().materials;
  const driveMin = z.billMi*2/L.mph*60*L.routeShare;
  const labor = (onsiteMin+driveMin)/60*L.rate*L.crew;
  const truck = z.billMi*2*L.routeShare*m.truckMile.cost;
  return { driveMin, labor, truck, direct: labor+truck };
}
function zonePrice(z){
  const ins = tripCost(z, z.installMin), rem = tripCost(z, z.removalMin);
  const iP = priceFrom(ins.direct,'install'), rP = priceFrom(rem.direct,'removal');
  const addl = PB().labor.addlSignMin/60*PB().labor.rate*PB().labor.crew; const aP = priceFrom(addl,'install');
  return { install:iP, removal:rP, addl:aP, installCost:loaded(ins.direct), removalCost:loaded(rem.direct), addlCost:loaded(addl), ins, rem };
}

function trailing(acctId){
  const a = Store.get('accounts',acctId) || {hist12:{orders:0,billed:0}};
  const cutoff = addDays(now(),-365);
  const live = Store.all('orders').filter(o=>o.accountId===acctId && o.stage!=='quote' && parseD(o.createdAt)>=cutoff && !o.legacy);
  const billed = Store.all('invoices').filter(i=>i.accountId===acctId && !i.legacy && parseD(i.issuedAt)>=cutoff).reduce((s,i)=>s+i.amount,0);
  return { orders:(a.hist12?.orders||0)+live.length, billed:(a.hist12?.billed||0)+billed };
}
function tierOf(acctId){
  const t = trailing(acctId), tiers = PB().tiers;
  if (t.billed>=50000) return tiers.find(x=>x.id==='builder');
  if (t.orders>=6) return tiers.find(x=>x.id==='program');
  return tiers.find(x=>x.id==='standard');
}

function quote(q, acctId){
  const pb=PB(), p=prod(q.productId), pol=pb.policy; const qty=Math.max(1, parseInt(q.qty)||1);
  const tier = tierOf(acctId); const lines=[]; const issues=[]; let cost=0;
  const w = p.custom ? Math.max(1, +q.w||0) : p.w, h = p.custom ? Math.max(1, +q.h||0) : p.h;
  const pp = panelPrice(p, w, h);
  if (p.custom && pp.area > p.maxSF) issues.push(`Over ${p.maxSF} SF needs a custom quote.`);
  lines.push({ label: p.name + (p.custom ? ` · ${w}′×${h}′ (${pp.area} SF)` : ''), qty, unit:pp.price, amt:pp.price*qty, kind:'panel' });
  cost += loaded(pp.direct)*qty;
  let goods = pp.price*qty;
  const pkgId = p.posts==='auto' ? autoPkg(pp.area) : p.posts;
  if (pkgId && q.includePosts) {
    const k = postPkg(pkgId);
    lines.push({ label:k.name+` (${k.posts} painted 4×4 posts, hardware)`, qty, unit:k.price, amt:k.price*qty, kind:'posts' });
    cost += loaded(k.direct)*qty; goods += k.price*qty;
  }
  if (tier.discount) { const d = -r2(goods*tier.discount); lines.push({ label:`${tier.name} account discount (${pct(tier.discount)})`, qty:1, unit:d, amt:d, kind:'disc' }); goods += d; }
  if (q.rush) { const r = r2(goods*pol.rushPct); lines.push({ label:`Rush production (${pct(pol.rushPct)})`, qty:1, unit:r, amt:r, kind:'rush' }); }
  const miles = cityMiles(q.city); const zone = zoneFor(miles);
  let zp = null;
  if (q.fulfillment==='install') {
    if (!zone) issues.push(`${q.city} is ${miles} mi out, past the last install zone. We'll quote this install by hand.`);
    else {
      zp = zonePrice(zone);
      const first = zp.install, addl = zp.addl*(qty-1);
      lines.push({ label:`Install, Zone ${zone.id} (${q.city}, ${miles} mi)`, qty:1, unit:first, amt:first, kind:'install' });
      cost += zp.installCost;
      if (qty>1) { lines.push({ label:`Additional sign, same site`, qty:qty-1, unit:zp.addl, amt:addl, kind:'install' }); cost += zp.addlCost*(qty-1); }
    }
  } else lines.push({ label:'Customer pickup at shop', qty:1, unit:0, amt:0, kind:'pickup' });
  const sub = r2(lines.reduce((s,l)=>s+l.amt,0));
  const tax = r2(sub*pol.taxRate);
  const total = r2(sub+tax);
  const deposit = r2(total*pol.depositPct);
  const removal = !zone ? null : tier.freeRemoval ? 0 : (zp||zonePrice(zone)).removal;
  return { lines, sub, tax, total, deposit, balance:r2(total-deposit), zone, miles, tier, removal, issues, cost:r2(cost), margin: sub ? 1 - cost/sub : 0, w, h, qty };
}

/* ============================================================
   AUTOMATIONS — every state change runs through here and logs what fired
   ============================================================ */
function nextInstallDay(from){
  let d = new Date(from); d.setHours(12,0,0,0);
  for (let i=0;i<90;i++){ if (CONFIG.ops.installDays.includes(d.getDay()) && loadOn(iso(d)) < CONFIG.ops.capacityPerDay) return iso(d); d=addDays(d,1); }
  return iso(d);
}
function loadOn(k){
  return Store.all('orders').filter(o=>o.stage==='ready'&&o.fulfillment==='install'&&o.scheduledDate===k).reduce((s,o)=>s+o.qty,0)
       + Store.all('fieldSigns').filter(f=>f.status==='removal_scheduled'&&f.removalDate===k).length;
}
function issueInvoice(o, kind, amount, note){
  const net = kind==='deposit' ? 0 : CONFIG.ops.balanceNetDays;
  const inv = { id:nextId('INV'), orderId:o?.id||'', accountId:o?.accountId, kind, amount:r2(amount), status:'open', issuedAt:iso(now()), dueAt:iso(addDays(now(),net)), note:note||'', qbo:'queued' };
  Store.put('invoices', inv);
  const a = Store.get('accounts', inv.accountId);
  logEvt('Invoice issued', `${inv.id} · ${kind} · ${money(inv.amount)} emailed to ${a?.billingEmail||'billing contact'} with pay link`, o?.id);
  return inv;
}
const Auto = {
  createOrder(q, acctId, stage){
    const qt = quote(q, acctId); const a = Store.get('accounts',acctId);
    const o = { id:nextId('SO'), accountId:acctId, contact:q.contact||a.contacts[0].name, street:q.street||'', city:q.city, miles:qt.miles, zone:qt.zone?.id||null,
      productId:q.productId, w:qt.w, h:qt.h, qty:qt.qty, fulfillment:q.fulfillment, includePosts:!!q.includePosts, rush:!!q.rush,
      copy:{ headline:q.headline||'FOR SALE', line1:q.line1||'', line2:q.line2||'' },
      lines:qt.lines, sub:qt.sub, tax:qt.tax, total:qt.total, estCost:qt.cost, extras:[], stage:'quote', proofRound:0, proofs:[], photos:[],
      createdAt:iso(now()), validUntil:iso(addDays(now(),PB().policy.quoteValidDays)), source:q.source||'portal' };
    Store.put('orders', o);
    logEvt('Quote created', `${o.id} · ${money(o.total)} locked until ${fmtD(o.validUntil)} (${o.source})`, o.id);
    if (stage!=='quote') Auto.sendDeposit(o.id);
    return o;
  },
  sendDeposit(id){
    const o = Store.get('orders',id); o.stage='deposit'; Store.put('orders',o);
    issueInvoice(o, 'deposit', o.total*PB().policy.depositPct);
    logEvt('Order confirmed', `${o.id} moved to deposit due. Reminders scheduled at 24 h and 72 h.`, o.id);
  },
  pay(invId, method){
    const inv = Store.get('invoices',invId); if (!inv || inv.status==='paid') return;
    inv.status='paid'; inv.paidAt=iso(now()); inv.method=method||'card'; inv.qbo='synced'; Store.put('invoices',inv);
    logEvt('Payment received', `${inv.id} · ${money(inv.amount)} by ${inv.method}. Synced to QuickBooks.`, inv.orderId);
    const o = Store.get('orders', inv.orderId);
    if (o && inv.kind==='deposit' && o.stage==='deposit') { o.stage='design'; o.depositPaidAt=iso(now()); Store.put('orders',o); logEvt('Released to design', `${o.id} entered the design queue. Designer notified.`, o.id); }
  },
  sendProof(id, file){
    const o = Store.get('orders',id); o.proofRound++; o.stage='proof';
    o.proofs.push({ v:o.proofRound, at:iso(now()), status:'sent', file: file||null });
    Store.put('orders',o);
    logEvt('Proof sent', `${o.id} proof v${o.proofRound} emailed to ${o.contact} with approve / request-changes links`, o.id);
  },
  approve(id, by){
    const o = Store.get('orders',id); const pr = o.proofs[o.proofs.length-1]; if (pr) { pr.status='approved'; pr.by=by; }
    o.stage='print'; o.approvedAt=iso(now()); Store.put('orders',o);
    logEvt('Proof approved', `${o.id} v${o.proofRound} approved by ${by}. Added to print queue.`, o.id);
  },
  requestChanges(id, note){
    const o = Store.get('orders',id); const pr = o.proofs[o.proofs.length-1]; if (pr) { pr.status='changes'; pr.note=note; }
    const pol = PB().policy;
    if (o.proofRound >= pol.includedProofRounds) { o.extras.push({ label:`Extra proof round (v${o.proofRound+1})`, amt:pol.extraProofFee }); logEvt('Fee added', `${o.id} extra proof round ${money(pol.extraProofFee)} added to balance`, o.id); }
    o.stage='design'; Store.put('orders',o);
    logEvt('Changes requested', `${o.id}: "${note||'no note'}". Back to designer.`, o.id);
  },
  printed(id){
    const o = Store.get('orders',id); const p=prod(o.productId); const area=o.w*o.h*o.qty*p.sides;
    if (p.print==='mounted') { consume('printVinyl', area); consume('laminate', area); }
    if (p.id==='BANNER') consume('banner13', o.w*o.h*o.qty);
    o.stage='build'; o.printedAt=iso(now()); Store.put('orders',o);
    logEvt('Printed', `${o.id} printed (${area} SF). Media drawn from inventory. Sent to shop.`, o.id);
  },
  built(id){
    const o = Store.get('orders',id); const p=prod(o.productId); const notes=[];
    if (p.substrate==='acm48') {
      const need = (p.custom ? Math.ceil(o.w*o.h/32) : p.sheets)*o.qty; const rec = invQty('panel_reclaimed'); const useRec = Math.min(rec, Math.floor(need));
      if (useRec) { consume('panel_reclaimed', useRec); notes.push(`${useRec} reclaimed panel(s)`); }
      if (need-useRec>0) { consume('acm48', need-useRec); notes.push(`${need-useRec} new ACM sheet(s)`); }
      const st=setting('stats'); st.id='stats'; st.builds=(st.builds||0)+o.qty; st.reclaimedBuilds=(st.reclaimedBuilds||0)+useRec; Store.put('settings',st);
    }
    if (p.substrate==='mdo48') { consume('mdo48', o.qty); notes.push(`${o.qty} MDO sheet(s)`); }
    if (o.includePosts && p.posts) { consume('post_ready', 2*o.qty); consume('hardware', o.qty); notes.push(`${2*o.qty} posts from stock`); }
    o.stage='ready'; o.builtAt=iso(now());
    if (o.fulfillment==='install') {
      const clear = addBusinessDays(now(), CONFIG.ops.digNoticeBusinessDays);
      o.locate = { ticket:'811-'+String(Math.floor(1e8+Math.random()*9e8)), requested:iso(now()), clears:iso(clear) };
      o.scheduledDate = nextInstallDay(addDays(clear,1));
      logEvt('Locate requested', `${o.id} Sunshine 811 ticket ${o.locate.ticket} filed; clears ${fmtD(o.locate.clears)}`, o.id);
      logEvt('Install scheduled', `${o.id} routed for ${fmtDow(o.scheduledDate)}. Customer notified.`, o.id);
    } else logEvt('Ready for pickup', `${o.id} ready. Pickup notice sent to ${o.contact}.`, o.id);
    Store.put('orders',o);
    logEvt('Built', `${o.id} built using ${notes.join(', ')||'customer-supplied materials'}`, o.id);
  },
  complete(id, how, evidence){
    const o = Store.get('orders',id); o.stage='done'; o.completedAt=iso(now()); o.completedHow=how;
    if (evidence?.photo) o.photos.push(evidence.photo);
    if (evidence?.signedBy) o.signedBy = evidence.signedBy;
    Store.put('orders',o);
    const depositAmt = Store.all('invoices').filter(i=>i.orderId===o.id && i.kind==='deposit').reduce((s,i)=>s+i.amount,0);
    const extras = (o.extras||[]).reduce((s,e)=>s+e.amt,0);
    issueInvoice(o, 'balance', o.total - depositAmt + r2(extras*(1+PB().policy.taxRate)), extras ? 'Includes extra proof rounds' : '');
    if (how==='install') {
      const p = prod(o.productId);
      for (let i=0;i<o.qty;i++) Store.put('fieldSigns', { id:nextId('FS'), orderId:o.id, accountId:o.accountId, street:o.street, city:o.city, miles:o.miles, zone:o.zone, size:`${o.h}×${o.w}`, productId:o.productId, posts:o.includePosts&&p.posts?2:0, installedAt:iso(now()), status:'in_field', photo:evidence?.photo||null, copy:o.copy.headline });
      logEvt('Installed', `${o.id} installed with photo on file. ${o.qty} sign(s) added to field map.`, o.id);
    } else logEvt('Picked up', `${o.id} picked up, signed by ${evidence?.signedBy}.`, o.id);
  },
  requestRemoval(fsId){
    const f = Store.get('fieldSigns',fsId); f.status='removal_scheduled'; f.requestedAt=iso(now());
    f.removalDate = nextInstallDay(addDays(now(),1));
    const free = tierOf(f.accountId).freeRemoval; f.removalFee = free ? 0 : zonePrice(zoneFor(f.miles)||PB().zones[2]).removal;
    Store.put('fieldSigns',f);
    logEvt('Removal scheduled', `${f.id} at ${f.street}, ${f.city} for ${fmtDow(f.removalDate)} · ${free?'free (Program/Builder account)':money(f.removalFee)}`, f.orderId);
  },
  removed(fsId, photo){
    const f = Store.get('fieldSigns',fsId); f.status='removed'; f.removedAt=iso(now()); if (photo) f.removalPhoto=photo; Store.put('fieldSigns',f);
    if (f.posts) adjust('post_repaint', f.posts);
    if (prod(f.productId)?.substrate==='acm48') adjust('panel_reface', 1);
    logEvt('Removed', `${f.id} picked up. ${f.posts} post(s) to repaint, panel to reface queue.`, f.orderId);
    if (f.removalFee) issueInvoice({id:f.orderId, accountId:f.accountId}, 'removal', f.removalFee*(1+PB().policy.taxRate));
  },
  repaint(n){ n=Math.min(n, invQty('post_repaint')); if(!n) return; consume('post_repaint', n); adjust('post_ready', n); const st=setting('stats'); st.id='stats'; st.postsRepainted=(st.postsRepainted||0)+n; Store.put('settings',st); logEvt('Posts repainted', `${n} posts repainted and returned to stock`); },
  reface(n){ n=Math.min(n, invQty('panel_reface')); if(!n) return; consume('panel_reface', n); adjust('panel_reclaimed', n); logEvt('Panels refaced', `${n} panels stripped and returned as reclaimed substrate`); },
  receive(itemId, n){ adjust(itemId, n); if (itemId==='post_ready') { const st=setting('stats'); st.id='stats'; st.postsNew=(st.postsNew||0)+n; Store.put('settings',st); } const it=Store.get('inventory',itemId); it.alerted=false; Store.put('inventory',it); logEvt('Stock received', `${n} ${it.unit} of ${it.name}`); },
};
function invQty(id){ return Store.get('inventory',id)?.qty || 0; }
function adjust(id, n){ const it=Store.get('inventory',id); if(!it) return; it.qty=r2(it.qty+n); Store.put('inventory',it); }
function consume(id, n){
  const it=Store.get('inventory',id); if(!it) return; it.qty=r2(it.qty-n); Store.put('inventory',it);
  if (it.min && it.qty<it.min && !it.alerted) { it.alerted=true; Store.put('inventory',it); logEvt('Reorder alert', `${it.name} at ${it.qty} ${it.unit}, below reorder point ${it.min}. PO draft created.`); }
}

/* ---------- INTAKE (AI email parsing) ---------- */
const SAMPLE_EMAIL = `From: Marcus Lee <marcus@gulfgate.example>
Subject: Sign for new listing - Gulf to Bay

Hi, need a 4x8 double sided FOR SALE sign at 2650 Gulf to Bay Blvd in Clearwater. It's ±1.8 acres, zoned C. Please install, and we'd like it up next week if possible. Same layout as our usual. Thanks!`;
function parseEmail(t){
  const s = t.toLowerCase(); const r = { found:[], missing:[], q:freshQuote() }; const q=r.q;
  const em = t.match(/[\w.+-]+@([\w-]+\.[\w.-]+)/); const accts = Store.all('accounts');
  const acct = accts.find(a=>em && em[1].toLowerCase()===a.domain) || accts.find(a=>s.includes(a.name.toLowerCase().split(' ')[0]));
  r.acct = acct?.id; acct ? r.found.push(`Account: ${acct.name} (${em&&em[1]===acct.domain?'matched sender domain':'matched name'})`) : r.missing.push('Account: not recognized, pick one');
  const nm = t.match(/From:\s*([^<\n]+)</i); q.contact = nm ? nm[1].trim() : acct?.contacts[0].name;
  const dm = s.match(/(\d{1,2})\s*(?:'|′|ft|foot)?\s*(?:x|×|by)\s*(\d{1,2})\b/);
  const isBanner = /banner/.test(s);
  if (dm) { const a=+dm[1], b=+dm[2]; q.h=Math.min(a,b); q.w=Math.max(a,b); r.found.push(`Size: ${q.h}′×${q.w}′`); } else r.missing.push('Size: assumed 4×8');
  const key = `${q.h}x${q.w}`;
  if (isBanner) q.productId='BANNER';
  else if (key==='4x8') q.productId = /mdo|plywood|wood/.test(s) ? 'MDO48DS' : /single[- ]?sided|one[- ]?sided/.test(s) ? 'ACM48SS' : 'ACM48DS';
  else if (key==='4x6') q.productId='ACM46DS'; else if (key==='4x4') q.productId='ACM44DS'; else if (key==='3x4') q.productId='ACM34DS'; else q.productId='ACMCUST';
  r.found.push(`Item: ${prod(q.productId).name}`);
  const words={one:1,two:2,three:3,four:4,five:5,six:6};
  const qm = s.match(/\b(\d+|two|three|four|five|six)\s+(?:signs|panels|banners)/); if (qm){ q.qty = words[qm[1]]||+qm[1]; r.found.push(`Quantity: ${q.qty}`); }
  if (/pick ?up|we'll grab|we will grab|install (it )?ourselves/.test(s)) { q.fulfillment='pickup'; r.found.push('Fulfillment: customer pickup'); } else r.found.push('Fulfillment: install');
  if (/\brush\b|asap|urgent|by tomorrow/.test(s)) { q.rush=true; r.found.push('Rush: yes'); }
  const st = t.match(/\b\d{2,6}\s+[A-Za-z0-9 .']+?\b(?:Road|Rd|Street|St|Avenue|Ave|Boulevard|Blvd|Highway|Hwy|Drive|Dr|Parkway|Pkwy|Way|Lane|Ln|Court|Ct)\b\.?/);
  if (st) { q.street=st[0].replace(/\.$/,''); r.found.push(`Street: ${q.street}`); } else r.missing.push('Street address');
  const city = CITIES.slice().sort((a,b)=>b[0].length-a[0].length).find(c=>s.includes(c[0].toLowerCase()));
  if (city) { q.city=city[0]; r.found.push(`City: ${city[0]} (${city[1]} mi)`); } else r.missing.push('City');
  const hl = HEADLINES.find(h=>s.includes(h.toLowerCase())); if (hl) { q.headline=hl; r.found.push(`Headline: ${hl}`); }
  const ac = t.match(/±?\s?[\d.,]+\s*(?:acres?|ac\b|sf\b|square feet)/i); if (ac) { q.line1 = ac[0].replace(/^±?\s?/,'±').replace(/\bac\b/i,'Acres').replace(/acres?/i,'Acres'); r.found.push(`Sign copy: ${q.line1}`); }
  const z = t.match(/zoned\s+([A-Z0-9-]+)/i); if (z) q.line2 = 'Zoned '+z[1].toUpperCase();
  q.source='email (AI intake)';
  return r;
}

/* ---------- INSTALLS ---------- */
function vInstalls(){
  const jobs = [];
  Store.all('orders').filter(o=>o.stage==='ready'&&o.fulfillment==='install').forEach(o=>jobs.push({type:'install', date:o.scheduledDate, o}));
  Store.all('fieldSigns').filter(f=>f.status==='removal_scheduled').forEach(f=>jobs.push({type:'removal', date:f.removalDate, f}));
  const byDate = {}; jobs.forEach(j=>(byDate[j.date] ||= []).push(j));
  const dates = Object.keys(byDate).sort();
  const t = iso(now());
  return `<p class="note">Install days: ${CONFIG.ops.installDays.map(d=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]).join(', ')} · capacity ${CONFIG.ops.capacityPerDay} stops per day. A job cannot close without a site photo. Sunshine 811 locate tickets are filed when the sign is built and must clear before digging.</p>
  ${dates.map(dt=>`<section class="card"><div class="card-h"><h2>${fmtDow(dt)}${dt===t?' · today':''}</h2><span class="muted">${byDate[dt].length} stop${byDate[dt].length===1?"":"s"} · sorted by zone</span></div><div class="list">
  ${byDate[dt].sort((a,b)=>((a.o||a.f).zone||9)-((b.o||b.f).zone||9)).map(j=>{
    if (j.type==='install'){ const o=j.o; const ph=state.pending[o.id]; const clear = !o.locate || parseD(o.locate.clears)<=now();
      return `<div class="item"><div class="grow"><span><span class="pill acc">Install</span> <b>${esc(o.street)}, ${esc(o.city)}</b></span><span>${o.id} · ${esc(acctName(o.accountId))} · ${esc(prod(o.productId).name)} × ${o.qty} · Zone ${o.zone}</span><span class="muted">811 ticket ${o.locate?.ticket||'—'} ${clear?'cleared':'clears '+fmtD(o.locate.clears)} · contact ${esc(o.contact)}</span></div>
      ${can('closeout')?`<div class="row"><label class="btn sm">${ph?'Photo: '+esc(ph.name):'Add site photo'}<input type="file" accept="image/*" hidden data-file="closeout" data-id="${o.id}"></label><button class="btn sm primary" data-act="closeout" data-id="${o.id}" ${ph?'':'disabled'}>Close out</button></div>`:''}</div>`; }
    const f=j.f; const ph=state.pending[f.id];
    return `<div class="item"><div class="grow"><span><span class="pill warn">Removal</span> <b>${esc(f.street)}, ${esc(f.city)}</b></span><span>${f.id} · ${esc(acctName(f.accountId))} · ${f.size} · ${f.posts} posts · Zone ${f.zone||'—'}</span><span class="muted">${f.removalFee?money(f.removalFee)+' removal fee':'Free removal'} · posts go to repaint, panel to reface</span></div>
      ${can('removal')?`<div class="row"><label class="btn sm">${ph?'Photo: '+esc(ph.name):'Add photo'}<input type="file" accept="image/*" hidden data-file="removal" data-id="${f.id}"></label><button class="btn sm primary" data-act="removed" data-id="${f.id}" ${ph?'':'disabled'}>Complete removal</button></div>`:''}</div>`;
  }).join('')}</div></section>`).join('') || '<section class="card"><p class="muted">No installs or removals scheduled.</p></section>'}`;
}

    <div class="kpi"><span class="eyebrow">Stock value</span><span class="v">${money0(items.reduce((s,i)=>s+val(i),0))}</span><span class="s">at current material costs</span></div>

  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Invoice</th><th>Account</th><th>Order</th><th>Type</th><th class="r">Amount</th><th>Issued</th><th>Status</th><th>QuickBooks</th><th></th></tr></thead><tbody>
  ${rows.map(i=>`<tr><td class="num">${i.id}</td><td>${esc(acctName(i.accountId))}</td><td class="num">${i.orderId&&i.orderId!=='legacy'?`<button class="btn sm" data-act="open" data-id="${i.orderId}">${i.orderId}</button>`:'<span class="muted">migrated</span>'}</td><td>${i.kind}</td><td class="r num">${money(i.amount)}</td><td class="num">${fmtD(i.issuedAt)}</td><td>${invPill(i)}</td><td><span class="pill ${i.qbo==='synced'?'good':''}">${i.qbo}</span></td>

document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  const v = id => (document.getElementById(id)?.value||'').trim();
  if (f.id==='contactForm') {
    if (!v('cfName') || !/^\S+@\S+\.\S+$/.test(v('cfEmail'))) { state.contactErr='Add your name and a valid email so we can reply.'; render(); return; }
    logEvt('Website inquiry', `${v('cfName')}${v('cfCo')?' ('+v('cfCo')+')':''} · ${v('cfEmail')} ${v('cfPhone')} · ${v('cfTopic')}: ${v('cfMsg')||'no message'}`);
    state.contactSent=true; state.contactErr=''; render(); return;
  }
  if (f.id==='loginForm') {
    const em=v('liEmail').toLowerCase(); state.loginEmail=em; const dom=em.split('@')[1];
    const a = dom && Store.all('accounts').find(x=>x.domain===dom);
    if (!a) { state.loginErr = em ? "We couldn't find an account for that email. Set one up on the right, or call the shop." : 'Enter your work email.'; render(); return; }
    enterPortal(a.id); return;
  }
  if (f.id==='signupForm') {
    const em=v('suEmail').toLowerCase();
    if (!v('suCo') || !v('suName') || !/^\S+@\S+\.\S+$/.test(em)) { state.signupErr='Company, your name and a valid work email are required.'; render(); return; }
    const dom=em.split('@')[1]; const ex=Store.all('accounts').find(x=>x.domain===dom);
    if (ex) { state.signupErr=`${ex.name} already has an account. Sign in on the left with your work email.`; render(); return; }
    const n = Store.all('accounts').length+1; const colors=['#1D3F8F','#8E1B1B','#0E6E8C','#6A3A73','#24525E','#2F5D3A','#6B4E16'];
    const a = { id:'A'+n+'-'+rid(), name:v('suCo'), type:v('suType'), domain:dom, color:colors[n%colors.length], hist12:{orders:0,billed:0}, billingEmail:em, phone:v('suPhone'), contacts:[{name:v('suName'),title:'',email:em}], createdAt:iso(now()) };
    Store.put('accounts', a); logEvt('New client account', `${a.name} (${a.type}) created on the website by ${v('suName')}, ${em}`);
    enterPortal(a.id);
  }
});

  if (key==='acct') { state.intake.draft.acct = v; } else target[key] = v;
  if (key==='productId') { const p=prod(v); if(!p.custom){ target.w=p.w; target.h=p.h; } else if (v==='BANNER'){ target.w=10; target.h=4; } target.includePosts=!!p.posts; render(); return; }
  const acct = ctx==='portal' ? state.acct : state.intake.draft.acct;
  $('#'+ctx+'-panel').innerHTML = quotePanel(ctx, target, acct);
}
document.addEventListener('input', e => { if (e.target.dataset.q && e.target.type!=='checkbox' && e.target.tagName!=='SELECT') onQuoteInput(e.target); });
document.addEventListener('change', async e => {
  const el=e.target;
  if (el.id==='roleSel'||el.id==='roleSel2') { state.role=el.value; state.openOrder=null; render(); return; }
  if (el.id==='acctSel') { state.acct=el.value; state.quote=freshQuote(); render(); return; }
  if (el.dataset.q && (el.type==='checkbox'||el.tagName==='SELECT')) { onQuoteInput(el); return; }
  if (el.dataset.pb) {
    const pb = JSON.parse(JSON.stringify(PB())); let v = parseFloat(el.value); if (isNaN(v)) return;
    if (PCT_PATHS.test(el.dataset.pb)) v = v/100;
    if (/^margins\./.test(el.dataset.pb) && (v<=0 || v>=0.95)) { toast('Margin must be between 0% and 95%'); render(); return; }
    setPath(pb, el.dataset.pb, v); Store.put('settings', pb);
    logEvt('Price book changed', `${el.dataset.pb} set to ${el.value}`); render(); toast('Prices recalculated'); return;
  }
  if (el.dataset.file) {
    const f = el.files[0]; if (!f) return;
    const up = await uploadFile(f, el.dataset.file+'/'+el.dataset.id);
    state.pending[el.dataset.file==='proof' ? 'proof-'+el.dataset.id : el.dataset.id] = up; render();
  }
});

Store.init().then(render);
</script>
</body></html>
